<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Set a new password for your ConfigKit account.">
<title>Reset password — ConfigKit</title>
<style>
:root{color-scheme:light;--ink:#17231f;--muted:#66736d;--line:#e4eae6;--paper:#f7f9f6;--white:#fff;--green:#226b51;--red:#9b3030}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 ui-sans-serif,system-ui,sans-serif}main{width:min(100% - 32px,520px);margin:8vh auto}.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:clamp(20px,5vw,32px)}h1{line-height:1.2}label{display:block;font-weight:650;margin:16px 0 6px}input{width:100%;padding:12px;border:1px solid #cbd6d0;border-radius:9px;font:inherit}button{margin-top:18px;padding:11px 16px;border:0;border-radius:9px;background:var(--green);color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.muted{color:var(--muted)}.status{padding:12px;border-radius:9px;background:#e8f4ed;margin:16px 0}.error{background:#fff0f0;color:var(--red)}[hidden]{display:none!important}
</style>
</head>
<body>
<main><section class="card">
<a href="login.html">← Back to sign in</a>
<h1>Choose a new password</h1>
<p class="muted">Use the secure recovery link sent to your registered email address.</p>
<div id="status" class="status" role="status" aria-live="polite">Checking your recovery link…</div>
<form id="reset-form" hidden>
<label for="password">New password</label>
<input id="password" type="password" autocomplete="new-password" minlength="10" required>
<label for="confirm-password">Confirm new password</label>
<input id="confirm-password" type="password" autocomplete="new-password" minlength="10" required>
<button id="submit" type="submit">Update password</button>
</form>
</section></main>
<script src="auth-config.js?v=passkey-policy-20261123"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
 const status=document.getElementById('status'),form=document.getElementById('reset-form'),submit=document.getElementById('submit');
 const config=window.CONFIGKIT_AUTH||{};
 if(!config.supabaseUrl||!config.supabaseAnonKey||!window.supabase?.createClient){status.textContent='Authentication is not configured.';status.classList.add('error');return;}
 const client=window.supabase.createClient(config.supabaseUrl,config.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}});
 const show=(text,error=false)=>{status.hidden=false;status.textContent=text;status.classList.toggle('error',error);};
 let recoveryReady=false;
 const enable=()=>{if(recoveryReady)return;recoveryReady=true;form.hidden=false;status.hidden=true;};
 client.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'&&session)enable();
 });
 client.auth.getSession().then(({data,error})=>{
  if(error)throw error;
  const hash=new URLSearchParams(location.hash.slice(1));
  if(data.session&&(hash.get('type')==='recovery'||hash.has('access_token'))){enable();return;}
  if(data.session&&recoveryReady){enable();return;}
  show('This recovery link is invalid, expired, or already used. Ask the ConfigKit owner to send a new password-reset email.',true);
 }).catch(error=>show(error.message||'Could not validate the recovery link.',true));
 form.addEventListener('submit',async event=>{
  event.preventDefault();
  const password=document.getElementById('password').value;
  const confirm=document.getElementById('confirm-password').value;
  if(password.length<10){show('Use a password with at least 10 characters.',true);return;}
  if(password!==confirm){show('The passwords do not match.',true);return;}
  submit.disabled=true;show('Updating your password…');
  const {error}=await client.auth.updateUser({password});
  submit.disabled=false;
  if(error){show(error.message,true);return;}
  form.hidden=true;show('Your password has been updated. You can now sign in with your new password.');
  await client.auth.signOut();
 });
})();
</script>
  <script src="/cookie-consent.js?v=2" defer></script>
</body></html>
