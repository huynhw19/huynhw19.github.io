<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4f8f5">
  <title>Page not found — ConfigKit</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #14251e;
      --muted: #586b61;
      --line: #dce7df;
      --paper: #f4f8f5;
      --green: #176344;
      --green-dark: #104b33;
      --mint: #e4f3e9;
      --shadow: 0 16px 38px rgba(18, 54, 37, .075);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 620px);
      padding: clamp(1.5rem, 5vw, 3rem);
      border: 1px solid var(--line);
      border-radius: 1.25rem;
      background: #fff;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .mark {
      display: inline-grid;
      width: 3rem;
      height: 3rem;
      place-items: center;
      border-radius: .9rem;
      background: var(--green);
      color: #fff;
      font-size: 1.5rem;
      font-weight: 700;
    }
    .code {
      margin: 1.2rem 0 0;
      color: var(--green-dark);
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      margin: .35rem 0 .65rem;
      font-size: clamp(2rem, 7vw, 3rem);
      line-height: 1.12;
      letter-spacing: -.04em;
    }
    p { margin: 0 auto; max-width: 44ch; color: var(--muted); }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .8rem;
      margin-top: 1.7rem;
    }
    .button {
      min-width: 170px;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: .75rem 1rem;
      border: 1px solid var(--line);
      border-radius: .85rem;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .button.primary { border-color: var(--green); background: var(--green); color: #fff; }
    .button:hover { filter: brightness(.97); text-decoration: none; }
    .button:focus-visible { outline: 3px solid #83c9a0; outline-offset: 3px; }
    .hint { margin-top: 1.25rem; font-size: .9rem; }
    @media (max-width: 420px) { .actions { flex-direction: column; } .button { width: 100%; } }
  </style>
  <link rel="stylesheet" href="brand.css?v=1">
  <link rel="icon" href="configkit-favicon.svg" type="image/svg+xml">
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">⌘</span>
    <p class="code">Error 404</p>
    <h1>We couldn't find that page.</h1>
    <p>The link may be outdated, or the address may have been typed incorrectly. Choose one of the options below to keep going.</p>
    <div class="actions">
      <button class="button" type="button" onclick="if (history.length > 1) { history.back(); } else { location.href = 'index.html'; }">Go back</button>
      <a class="button primary" href="index.html">Go to homepage</a>
    </div>
    <p class="hint">Need a hand? Visit the <a href="wiki.html">ConfigKit help centre</a>.</p>
  </main>
  <script src="/cookie-consent.js?v=2" defer></script>
</body>
</html>
