<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Completing sign-in — ConfigKit</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f9f6;color:#17231f;font:16px/1.6 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:34rem;margin:1rem;padding:2rem;background:#fff;border:1px solid #e4eae6;border-radius:1rem}
    a{color:#226b51} [role=status]{color:#66736d}
  </style>
</head>
<body>
  <main>
    <h1>Completing sign-in</h1>
    <p id="status" role="status" aria-live="polite">Please wait while we verify your sign-in…</p>
    <p><a href="/login.html">Return to sign in</a></p>
  </main>
  <script src="/auth-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (async () => {
      const status = document.getElementById('status');
      const config = window.CONFIGKIT_AUTH || {};
      const params = new URLSearchParams(window.location.search);
      const providerError = params.get('error_description') || params.get('error');

      if (providerError) {
        status.textContent = 'Sign-in was not completed. Return to the sign-in page and try again.';
        return;
      }
      if (!config.supabaseUrl || !config.supabaseAnonKey || !window.supabase?.createClient) {
        status.textContent = 'Sign-in could not be completed because authentication is not configured.';
        return;
      }

      try {
        const client = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey, {
          auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}
        });
        const {data, error} = await client.auth.getSession();
        if (error) throw error;
        if (!data.session) {
          status.textContent = 'No active sign-in was found. Return to the sign-in page and try again.';
          return;
        }
        status.textContent = 'Sign-in complete. Opening your dashboard…';
        window.location.replace('/dashboard.html');
      } catch (_) {
        status.textContent = 'We could not verify your sign-in. Return to the sign-in page and try again.';
      }
    })();
  </script>
</body>
</html>
