<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connected apps — ConfigKit</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f8f5;color:#17231f;font:16px/1.55 system-ui,sans-serif}.wrap{width:min(100% - 32px,850px);margin:5vh auto}header{padding:1rem 0;border-bottom:1px solid #e1e9e3}main{padding:2rem 0}.card{background:white;border:1px solid #e1e9e3;border-radius:14px;padding:20px;margin:14px 0}.muted{color:#66736c}.status{padding:12px;border-radius:9px;background:#edf5ef}.error{background:#fff0f0;color:#8a2828}button{font:inherit;font-weight:650;border:0;border-radius:8px;padding:10px 16px;background:#8e2e2e;color:white;cursor:pointer}.pill{display:inline-block;border-radius:99px;background:#edf5ef;padding:3px 9px;font-size:.85rem}</style></head><body><div class="wrap"><header><strong>⌘ ConfigKit</strong> · <a href="account-settings.html">Account settings</a></header><main><h1>Connected applications</h1><p class="muted">Review third-party apps that you have authorized to access your ConfigKit identity. You can revoke access at any time.</p><div id="status" class="status">Loading…</div><div id="grants"></div></main></div><script src="auth-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{const status=document.getElementById('status'),list=document.getElementById('grants'),say=(m,b=false)=>{status.textContent=m;status.classList.toggle('error',b)};const cfg=window.CONFIGKIT_AUTH||{},client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const {data:{session}}=await client.auth.getSession();if(!session){say('Please sign in to view connected apps.',true);const a=document.createElement('a');a.href='login.html?next=connected-apps.html';a.textContent='Sign in';status.append(' ',a);return}const {data,error}=await client.auth.oauth.listGrants();if(error)throw error;const grants=data||[];if(!grants.length){say('No applications currently have access to your account.');return}say(grants.length+' connected application(s).');for(const g of grants){const card=document.createElement('section');card.className='card';const title=document.createElement('h2');title.textContent=g.client_name||'Connected app';const scope=document.createElement('p');scope.className='muted';scope.textContent='Permissions: '+(g.scopes||[]).join(', ');const date=document.createElement('p');date.className='muted';date.textContent='Connected: '+new Date(g.created_at).toLocaleString();const button=document.createElement('button');button.textContent='Revoke access';button.addEventListener('click',async()=>{if(!confirm('Revoke this app’s access? Its refresh tokens will be invalidated.'))return;button.disabled=true;const {error}=await client.auth.oauth.revokeGrant({clientId:g.client_id});if(error){say(error.message,true);button.disabled=false;return}card.remove();say('Access revoked.');});card.append(title,scope,date,button);list.append(card)}})().catch(e=>{const s=document.getElementById('status');s.textContent=e.message||'Could not load connected applications.';s.classList.add('error')});
</script></body></html>
