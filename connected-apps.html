<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Connected apps — ConfigKit</title>
<style>body{margin:0;background:#f7f9f6;color:#17231f;font:16px/1.6 system-ui,sans-serif}main{max-width:46rem;margin:2rem auto;padding:1.25rem}.muted{color:#66736d}.grant{background:white;border:1px solid #e4eae6;border-radius:.8rem;padding:1rem;margin:1rem 0}button{font:inherit;padding:.6rem .9rem;border:0;border-radius:.45rem;background:#f4e9e9;color:#9b3030;font-weight:650;cursor:pointer}button:disabled{opacity:.6}.error{color:#9b3030}</style>  <link rel="stylesheet" href="brand.css?v=1">
  <link rel="icon" href="configkit-favicon.svg" type="image/svg+xml">
</head><body><main><p><a href="/account-settings.html">← Account settings</a></p><h1>Connected apps</h1><p class="muted">Review third-party apps authorized to access your ConfigKit account. Revoking a grant invalidates its active OAuth sessions and refresh tokens.</p><p id="status" role="status" aria-live="polite">Loading…</p><div id="grants"></div></main>
<script src="/auth-config.js?v=passkey-policy-20261123"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script><script>
(async()=>{const $=id=>document.getElementById(id),status=$('status'),root=$('grants'),cfg=window.CONFIGKIT_AUTH||{};if(!cfg.supabaseUrl||!cfg.supabaseAnonKey||!window.supabase?.createClient){status.textContent='Authentication is not configured.';return}
const client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const {data:{user},error:userError}=await client.auth.getUser();if(userError||!user){location.replace('/login.html?next=connected-apps.html');return}
async function load(){root.replaceChildren();status.textContent='Loading connected apps…';const {data,error}=await client.auth.oauth.listGrants();if(error){status.textContent='Could not load connected apps. The OAuth server may not be enabled.';status.className='error';return}if(!data?.length){status.textContent='No third-party apps currently have access to your account.';return}status.textContent='';for(const grant of data){const card=document.createElement('section');card.className='grant';const title=document.createElement('h2');title.textContent=grant.client?.name||'Unnamed application';const scope=document.createElement('p');scope.className='muted';scope.textContent='Permissions: '+((grant.scopes||[]).join(', ')||'None listed');const date=document.createElement('p');date.className='muted';date.textContent=grant.granted_at?'Approved: '+new Date(grant.granted_at).toLocaleString():'';const revoke=document.createElement('button');revoke.type='button';revoke.textContent='Revoke access';revoke.addEventListener('click',async()=>{if(!confirm('Revoke access for '+title.textContent+'?'))return;revoke.disabled=true;const {error:revokeError}=await client.auth.oauth.revokeGrant({clientId:grant.client.id});if(revokeError){status.textContent='Could not revoke access. Please try again.';status.className='error';revoke.disabled=false;return}await load()});card.append(title,scope,date,revoke);root.append(card)}}await load()})().catch(()=>{const s=document.getElementById('status');s.textContent='Something went wrong while loading connected apps.';s.className='error'});
</script>  <script src="/cookie-consent.js?v=2" defer></script>
</body></html>
