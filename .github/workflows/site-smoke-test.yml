name: ConfigKit website smoke tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * *"

permissions:
  contents: read

concurrency:
  group: configkit-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-script-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check published Admin Dashboard scripts
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://huynhw19.github.io/admin-portal.html';
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) throw new Error('Admin page returned HTTP ' + response.status);
          const html = await response.text();
          const marker = '<script>';
          const start = html.indexOf(marker, html.indexOf('supabase-js'));
          const end = html.indexOf('</script>', start);
          if (start < 0 || end < 0) throw new Error('Could not locate the dashboard inline script');
          const source = html.slice(start + marker.length, end);
          console.log('Published page:', url, 'HTTP', response.status, 'inline script chars:', source.length);
          try {
            new Function(source);
            console.log('PASS: Admin Dashboard inline script parses');
          } catch (error) {
            console.error('FAIL: Admin Dashboard inline script:', error.stack || error.message);
            process.exitCode = 1;
          }
          console.log('Initial UI contains verifying text:', html.includes('Verifying your administrator access'));
          NODE
