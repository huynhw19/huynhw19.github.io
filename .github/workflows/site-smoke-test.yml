name: ConfigKit website smoke tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * *"

permissions:
  contents: read

concurrency:
  group: configkit-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-script-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check published Admin Dashboard scripts
        run: |
          node --input-type=module <<'NODE'
          const fs = await import('node:fs/promises');
          const html = await fs.readFile('admin-portal.html', 'utf8');
          const marker = '<script>';
          const start = html.indexOf(marker, html.indexOf('supabase-js'));
          const end = html.indexOf('</script>', start);
          if (start < 0 || end < 0) throw new Error('Could not locate the dashboard inline script');
          const source = html.slice(start + marker.length, end);
          await fs.writeFile('/tmp/admin-inline.js', source);
          console.log('Repository Admin Dashboard inline script chars:', source.length);
          try {
            new Function(source);
            console.log('PASS: Admin Dashboard inline script parses');
          } catch (error) {
            console.error('FAIL: Admin Dashboard inline script:', error.stack || error.message);
            const { spawnSync } = await import('node:child_process');
            const check = spawnSync(process.execPath, ['--check', '/tmp/admin-inline.js'], { encoding: 'utf8' });
            console.error(check.stderr || check.stdout);
            process.exitCode = 1;
          }
          console.log('Initial UI contains verifying text:', html.includes('Verifying your administrator access'));
          NODE
