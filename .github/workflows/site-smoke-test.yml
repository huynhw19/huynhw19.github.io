name: ConfigKit website smoke tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * *"

permissions:
  contents: read

concurrency:
  group: configkit-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-script-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check published Admin Dashboard scripts
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://huynhw19.github.io/admin-portal.html';
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) throw new Error('Admin page returned HTTP ' + response.status);
          const html = await response.text();
          const scripts = [...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)];
          console.log('Published page:', url, 'HTTP', response.status, 'inline scripts:', scripts.length);
          if (!scripts.length) throw new Error('No inline dashboard script found');
          for (let i = 0; i < scripts.length; i++) {
            try {
              new Function(scripts[i][1]);
              console.log('PASS: inline script', i + 1, 'parses');
            } catch (error) {
              console.error('FAIL: inline script', i + 1, error.stack || error.message);
              process.exitCode = 1;
            }
          }
          const identity = html.match(/id="identity"[^>]*>([^<]*)</)?.[1] || '';
          const status = html.match(/id="status"[^>]*>([^<]*)</)?.[1] || '';
          console.log('Initial identity:', identity);
          console.log('Initial status:', status);
          NODE
