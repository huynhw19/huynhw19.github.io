name: ConfigKit website smoke tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * *"

permissions:
  contents: read

concurrency:
  group: configkit-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source script syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const html = await fs.readFile('admin-portal.html', 'utf8');
          const marker = '<script>';
          const start = html.indexOf(marker, html.indexOf('supabase-js'));
          const end = html.indexOf('</script>', start);
          if (start < 0 || end < 0) throw new Error('Could not locate the dashboard inline script');
          const source = html.slice(start + marker.length, end);
          new Function(source);
          console.log('PASS: repository Admin Dashboard script parses');
          NODE
      - name: Install browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Verify published Admin Dashboard starts
        env:
          SITE_URL: https://huynhw19.github.io
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const base = process.env.SITE_URL;
          const marker = 'Startup repair: script syntax verified in CI';
          let published = false;
          for (let i = 0; i < 30; i++) {
            const response = await fetch(base + '/admin-portal.html?check=' + Date.now(), { cache: 'no-store' });
            if (response.ok && (await response.text()).includes(marker)) { published = true; break; }
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          if (!published) throw new Error('The repaired Admin Dashboard has not appeared on the published site yet.');
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.stack || error.message));
            page.on('console', message => { if (message.type() === 'error') errors.push(message.text()); });
            await page.goto(base + '/admin-portal.html?check=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(4000);
            const status = await page.locator('#status').innerText();
            const identity = await page.locator('#identity').innerText();
            console.log('Admin status:', status);
            console.log('Admin identity:', identity);
            if (status.includes('Loading secure admin workspace')) errors.push('Dashboard stayed on its initial loading message.');
            if (identity.includes('Verifying your administrator access')) errors.push('Identity stayed on its initial verification message.');
            if (!status.includes('Please sign in to ConfigKit') && !status.includes('Owner access verified') && !status.includes('Administrator access verified')) errors.push('Dashboard did not reach a recognised authentication state.');
            if (errors.length) throw new Error(errors.join('\n'));
            console.log('PASS: published Admin Dashboard script ran and reached an authentication state.');
          } finally { await browser.close(); }
          NODE

  scratch-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Scratch Studio and player script syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          for (const file of ['scratch-studio.html', 'scratch-project.html']) {
            const html = await fs.readFile(file, 'utf8');
            const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
              .map(match => match[1]).filter(source => source.trim());
            if (!scripts.length) throw new Error(file + ': no inline script found');
            for (const source of scripts) new Function(source);
            console.log('PASS: ' + file + ' inline scripts parse (' + scripts.length + ')');
          }
          NODE
      - name: Install browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Verify published Studio and compatible player
        env:
          SITE_URL: https://huynhw19.github.io
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const base = process.env.SITE_URL;
          let published = false;
          for (let i = 0; i < 30; i++) {
            const response = await fetch(base + '/scratch-studio.html?check=' + Date.now(), { cache: 'no-store' });
            if (response.ok && (await response.text()).includes('data-studio-build="2026-11-27"')) { published = true; break; }
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          if (!published) throw new Error('Scratch Studio has not appeared on the published site yet.');
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.stack || error.message));
            await page.goto(base + '/scratch-studio.html?check=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.locator('#account-pill').waitFor({ state: 'visible', timeout: 15000 });
            await page.waitForFunction(() => document.querySelector('#account-pill')?.textContent !== 'Checking account…', null, { timeout: 15000 });
            const account = await page.locator('#account-pill').innerText();
            if (!['Signed out', 'Signed in'].includes(account)) errors.push('Studio did not reach a recognised account state: ' + account);
            await page.getByRole('button', { name: /My Projects/ }).click();
            if (!(await page.locator('#tab-projects').isVisible())) errors.push('Project library navigation did not open.');
            await page.locator('#upload-project-btn').click();
            if (!(await page.locator('#upload-panel').isVisible())) errors.push('Project upload panel did not open.');
            await page.goto(base + '/scratch-project.html?check=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.locator('#runtime-status').waitFor({ state: 'visible', timeout: 15000 });
            if (errors.length) throw new Error(errors.join('\n'));
            console.log('PASS: published Studio starts, navigation and upload panel work, and compatible player starts.');
          } finally { await browser.close(); }
          NODE

  coding-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Coding Studio script syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const html = await fs.readFile('coding-studio.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)]
            .map(match => match[1]).filter(source => source.trim());
          if (scripts.length < 2) throw new Error('Expected both Coding Studio inline scripts');
          for (const source of scripts) new Function(source);
          console.log('PASS: all ' + scripts.length + ' Coding Studio inline scripts parse');
          NODE
      - name: Install browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Verify published Coding Studio editor and project workflow
        env:
          SITE_URL: https://huynhw19.github.io
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const base = process.env.SITE_URL;
          let published = false;
          for (let i = 0; i < 30; i++) {
            const response = await fetch(base + '/coding-studio.html?check=' + Date.now(), { cache: 'no-store' });
            if (response.ok && (await response.text()).includes('data-coding-studio-build="2026-11-27"')) { published = true; break; }
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          if (!published) throw new Error('Coding Studio has not appeared on the published site yet.');
          const browser = await chromium.launch({ headless: true });
          try {
            const context = await browser.newContext();
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.stack || error.message));
            await page.goto(base + '/coding-studio.html?check=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForFunction(() => !!window.Blockly && !!window.Blockly.JavaScript && !!window.Blockly.Python, null, { timeout: 30000 });
            await page.waitForFunction(() => document.querySelector('#code-view')?.textContent.includes('Hello from ConfigKit'), null, { timeout: 15000 });
            await page.waitForFunction(() => document.querySelectorAll('#extension-grid input[type=checkbox]').length === 6, null, { timeout: 15000 });
            const extensionCount = await page.locator('#extension-grid input[type=checkbox]').count();
            if (extensionCount !== 6) errors.push('Extension manager did not load all six extensions.');
            await page.locator('#extension-grid input[type=checkbox]').nth(4).uncheck();
            if (!(await page.locator('#extension-status').innerText()).includes('5 of 6')) errors.push('Extension toggle did not update the enabled toolbox.');
            await page.locator('#extension-grid input[type=checkbox]').nth(4).check();
            const customBlocks = await page.evaluate(() => ['ck_goto','ck_pen_down','ck_when_flag','ck_key_pressed','ck_backdrop'].every(type => !!Blockly.Blocks[type]));
            if (!customBlocks) errors.push('Custom extension blocks were not registered.');
            await page.getByRole('tab', { name: 'Python' }).click();
            if (!(await page.locator('#code-view').innerText()).includes('print')) errors.push('Python code generation did not produce a print statement.');
            await page.getByRole('tab', { name: 'JavaScript' }).click();
            await page.locator('#run-code').click();
            await page.waitForFunction(() => document.querySelector('#output')?.innerText.includes('Hello from ConfigKit!'), null, { timeout: 10000 });
            await page.locator('#project-name').fill('CI Coding Project');
            await page.locator('#save-project').click();
            if (!(await page.locator('#saved-projects option').evaluateAll(options => options.some(option => option.value === 'CI Coding Project')))) errors.push('Saved project did not appear in the project list.');
            await page.locator('#saved-projects').selectOption('CI Coding Project');
            await page.locator('#open-project').click();
            if (errors.length) throw new Error(errors.join('\\n'));
            console.log('PASS: Blockly loads, JS/Python generation works, JS runner executes, and local save/open works.');
          } finally { await browser.close(); }
          NODE
