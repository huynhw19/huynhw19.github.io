name: Windows desktop app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop build dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        run: npm run dist:win
      - name: Verify Windows installer
        shell: pwsh
        run: |
          $installer = Get-Item "release/ConfigKit-Windows-Setup.exe"
          if ($installer.Length -lt 10MB) { throw "Installer unexpectedly small." }
          $bytes = [System.IO.File]::ReadAllBytes($installer.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Installer is not a Windows PE executable." }
          Get-FileHash $installer.FullName -Algorithm SHA256
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ConfigKit-Windows-Installer
          path: release/ConfigKit-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 30
