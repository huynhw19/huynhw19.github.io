plugins {
    id 'com.android.application'
}
android {
    namespace 'com.configkit.android'
    compileSdk 35
    defaultConfig {
        applicationId 'com.configkit.android'
        minSdk 26
        targetSdk 35
        versionCode (findProperty("VERSION_CODE") ?: "1").toInteger()
        versionName findProperty("VERSION_NAME") ?: "1.0.0"
    }
}
