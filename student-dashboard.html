<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student dashboard — ConfigKit</title>
  <style>
    body { font-family: sans-serif; margin: 24px; background: #f5f7f6; color: #17231f; line-height: 1.6; }
    main { max-width: 720px; margin: 5vh auto; }
    .card { background: white; border: 1px solid #dfe9e5; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .status { color: #174b39; }
    .error { color: #9b3030; }
    .record { padding: 12px 0; border-top: 1px solid #e5ece8; }
    .assignment { padding:14px 0; border-top:1px solid #e5ece8; }
    .assignment-meta { color:#56645e; font-size:.95rem; }
    .document-content { white-space:pre-wrap; overflow-wrap:anywhere; }
    button, .button { display: inline-block; padding: 10px 14px; border: 0; border-radius: 8px; background: #226b51; color: white; text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <a href="dashboard.html">← ConfigKit dashboard</a>
      <h1>Student dashboard</h1>
      <p id="status" class="status" role="status" aria-live="polite">Checking your sign in…</p>
      <div id="records"></div>
      <section id="student-slideshows" aria-labelledby="student-slideshows-title" hidden><h2 id="student-slideshows-title">My lesson slideshows</h2><div id="student-slideshow-records"></div></section>
      <section id="student-books" aria-labelledby="student-books-title" hidden>
        <h2 id="student-books-title">My books</h2>
        <div id="student-book-records"></div>
      </section>
      <section id="student-documents" aria-labelledby="student-documents-title" hidden>
        <h2 id="student-documents-title">My documents</h2>
        <div id="student-document-records"></div>
      </section>
      <section id="assignments" aria-labelledby="assignments-title" hidden>
        <h2 id="assignments-title">My assignments</h2>
        <div id="assignment-records"></div>
      </section>
      <button id="signout" type="button" hidden>Sign out</button>
    </section>
  </main>
  <script src="auth-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (() => {
      const status = document.getElementById('status');
      const records = document.getElementById('records');
      const assignmentsPanel = document.getElementById('assignments');
      const slideshowsPanel = document.getElementById('student-slideshows');
      const slideshowRecords = document.getElementById('student-slideshow-records');
      const assignmentRecords = document.getElementById('assignment-records');
      const documentsPanel = document.getElementById('student-documents');
      const booksPanel=document.getElementById('student-books');
      const bookRecords=document.getElementById('student-book-records');
      const documentRecords = document.getElementById('student-document-records');
      const signout = document.getElementById('signout');
      const config = window.CONFIGKIT_AUTH || {};
      const showStatus = (message, isError = false) => {
        status.textContent = message;
        status.className = isError ? 'status error' : 'status';
      };
      if (!config.supabaseUrl || !config.supabaseAnonKey || !window.supabase?.createClient) {
        showStatus('Authentication is not configured. Please contact the site owner.', true);
        return;
      }
      const client = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
      });
      async function render() {
        const { data, error } = await client.auth.getSession();
        if (error || !data.session) {
          window.location.replace('student-login.html');
          return;
        }
        signout.hidden = false;
        const { data: studentRecords, error: recordsError } = await client
          .from('education_students')
          .select('id, user_id, student_name, school, grade, created_at')
          .eq('student_user_id', data.session.user.id)
          .order('created_at', { ascending: false });
        if (recordsError) {
          showStatus('Could not load your student record. Ask your teacher or the site owner to check the student login setup.', true);
          return;
        }
        if (!studentRecords || studentRecords.length === 0) {
          showStatus('You are signed in, but no teacher-created student record is linked to this account yet. Confirm you used the exact email your teacher entered, then contact your teacher if needed.');
          return;
        }
        showStatus(`Signed in as ${data.session.user.email || 'student'}.`);

        const teacherIds = [...new Set(studentRecords.map(student => student.user_id))];
        const {data: publishedSlideshows, error: slideshowError} = await client.from('education_slideshows')
          .select('id,title,description,slides,created_at,user_id')
          .in('user_id', teacherIds).eq('status','published').order('created_at',{ascending:false});
        slideshowsPanel.hidden = false;
        slideshowRecords.replaceChildren();
        if (slideshowError) {
          const warning = document.createElement('p'); warning.className = 'error';
          warning.textContent = 'Could not load lesson slideshows.'; slideshowRecords.append(warning);
        } else if (!publishedSlideshows || !publishedSlideshows.length) {
          const empty = document.createElement('p'); empty.textContent = 'Your teachers have not published any slideshows yet.'; slideshowRecords.append(empty);
        } else {
          publishedSlideshows.forEach(show => {
            const article = document.createElement('article'); article.className = 'assignment';
            const title = document.createElement('h3'); title.textContent = show.title; article.append(title);
            if (show.description) { const desc = document.createElement('p'); desc.textContent = show.description; article.append(desc); }
            (show.slides || []).forEach((slide,index) => {
              const part = document.createElement('section'); part.className = 'record';
              const heading = document.createElement('h4'); heading.textContent = 'Slide ' + (index + 1) + ': ' + (slide.title || '');
              part.append(heading);
              if (slide.content) { const body = document.createElement('p'); body.textContent = slide.content; part.append(body); }
              if (slide.image_url && /^https:\/\//i.test(slide.image_url)) {
                const img = document.createElement('img'); img.src = slide.image_url; img.alt = slide.title || 'Slideshow image';
                img.loading = 'lazy'; img.style.cssText = 'display:block;max-width:100%;height:auto;border-radius:8px;margin:10px 0'; part.append(img);
              }
              article.append(part);
            });
            slideshowRecords.append(article);
          });
        }

        const {data:publishedBooks,error:booksError}=await client.from('education_books')
          .select('id,user_id,student_id,title,description,chapters,created_at,updated_at')
          .in('user_id',teacherIds).eq('status','published').order('updated_at',{ascending:false});
        booksPanel.hidden=false;bookRecords.replaceChildren();
        if(booksError){const warning=document.createElement('p');warning.className='error';warning.textContent='Could not load your books. Ask your teacher to check the book setup.';bookRecords.append(warning);}
        else if(!publishedBooks?.length){const empty=document.createElement('p');empty.textContent='Your teachers have not published any books for you yet.';bookRecords.append(empty);}
        else{publishedBooks.filter(book=>!book.student_id||studentRecords.some(st=>st.id===book.student_id)).forEach(book=>{const article=document.createElement('article');article.className='assignment';const title=document.createElement('h3');title.textContent=book.title;article.append(title);if(book.description){const desc=document.createElement('p');desc.textContent=book.description;article.append(desc);}const meta=document.createElement('p');meta.className='assignment-meta';meta.textContent=(book.chapters||[]).length+' chapters · Updated '+new Date(book.updated_at||book.created_at).toLocaleDateString();article.append(meta);(book.chapters||[]).forEach((chapter,index)=>{const part=document.createElement('section');part.className='record';const heading=document.createElement('h4');heading.textContent='Chapter '+(index+1)+': '+chapter.title;const body=document.createElement('div');body.className='document-content';body.textContent=chapter.content||'';part.append(heading,body);article.append(part);});bookRecords.append(article);});}

        const {data: publishedDocuments, error: documentsError} = await client.from('education_documents')
          .select('id,user_id,student_id,title,content,created_at,updated_at')
          .in('user_id',teacherIds).eq('status','published').order('updated_at',{ascending:false});
        documentsPanel.hidden = false;
        documentRecords.replaceChildren();
        if (documentsError) {
          const warning=document.createElement('p'); warning.className='error';
          warning.textContent='Could not load your documents. Please ask your teacher to check the document setup.';
          documentRecords.append(warning);
        } else if (!publishedDocuments || !publishedDocuments.length) {
          const empty=document.createElement('p');
          empty.textContent='Your teachers have not published any documents for you yet.';
          documentRecords.append(empty);
        } else {
          publishedDocuments.forEach(doc=>{
            const article=document.createElement('article'); article.className='assignment';
            const title=document.createElement('h3'); title.textContent=doc.title;
            const relatedStudent=studentRecords.find(student=>student.id===doc.student_id);
            const meta=document.createElement('p'); meta.className='assignment-meta';
            meta.textContent=(doc.student_id ? (relatedStudent?.student_name || 'Shared with you') : 'Shared with your class')
              + ' · Updated ' + new Date(doc.updated_at || doc.created_at).toLocaleDateString();
            const body=document.createElement('div'); body.className='document-content'; body.textContent=doc.content || '';
            article.append(title,meta,body); documentRecords.append(article);
          });
        }

        const studentIds = studentRecords.map(student => student.id);
        const { data: assignments, error: assignmentsError } = await client
          .from('education_assignments')
          .select('id, student_id, title, instructions, due_date, created_at')
          .in('student_id', studentIds)
          .eq('status', 'published')
          .order('due_date', { ascending: true, nullsFirst: false });
        assignmentsPanel.hidden = false;
        assignmentRecords.replaceChildren();
        if (assignmentsError) {
          const warning = document.createElement('p');
          warning.className = 'error';
          warning.textContent = 'Could not load assignments. Ask your teacher to check the assignment setup.';
          assignmentRecords.append(warning);
        } else if (!assignments || assignments.length === 0) {
          const empty = document.createElement('p');
          empty.textContent = 'You do not have any published assignments yet.';
          assignmentRecords.append(empty);
        } else {
          assignments.forEach(assignment => {
            const item = document.createElement('article');
            item.className = 'assignment';
            const title = document.createElement('h3');
            title.textContent = assignment.title;
            const student = studentRecords.find(record => record.id === assignment.student_id);
            const meta = document.createElement('p');
            meta.className = 'assignment-meta';
            meta.textContent = (student?.student_name || 'Your assignment') + ' · Due: ' + (assignment.due_date || 'No due date');
            item.append(title, meta);
            if (assignment.instructions) {
              const instructions = document.createElement('p');
              instructions.textContent = assignment.instructions;
              item.append(instructions);
            }
            assignmentRecords.append(item);
          });
        }
        studentRecords.forEach(student => {
          const item = document.createElement('article');
          item.className = 'record';
          const name = document.createElement('strong');
          name.textContent = student.student_name;
          const details = document.createElement('p');
          details.textContent = `${student.school || 'School not set'} · ${student.grade || 'Grade not set'}`;
          item.append(name, details);
          records.append(item);
        });
      }
      signout.addEventListener('click', async () => {
        signout.disabled = true;
        const { error } = await client.auth.signOut();
        signout.disabled = false;
        if (error) { showStatus('Could not sign out. Please try again.', true); return; }
        window.location.replace('student-login.html');
      });
      client.auth.onAuthStateChange((_event, session) => {
        if (!session) window.location.replace('student-login.html');
      });
      void render();
    })();
  </script>
</body>
</html>
