<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Official ConfigKit announcements and platform updates."><title>ConfigKit Announcements</title><link rel="stylesheet" href="brand.css?v=1"><link rel="icon" href="configkit-favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:#17231f;font:16px/1.6 system-ui,sans-serif}.head{background:#fff;border-bottom:1px solid #e1e9e3;padding:16px max(20px,calc((100% - 1080px)/2));display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.head a{color:#226b51}main{width:min(1080px,calc(100% - 32px));margin:36px auto}.hero{padding:26px;border-radius:18px;background:linear-gradient(130deg,#fff,#eff8f1);border:1px solid #dce9df}.hero h1{font-size:clamp(2rem,5vw,3rem);line-height:1.1;margin:8px 0}.muted{color:#66736d}.list{display:grid;gap:14px;margin-top:20px}.item{background:#fff;border:1px solid #e1e9e3;border-radius:14px;padding:20px}.item h2{margin:0 0 8px;font-size:1.25rem}.date{font-size:.85rem;color:#66736d}.empty,.status{padding:18px;border:1px dashed #cbd8cf;border-radius:12px;color:#66736d;background:#fff}
</style></head><body><header class="head"><a href="dashboard.html">⌘ ConfigKit</a><nav><a href="dashboard.html">Dashboard</a> · <a href="admin-portal.html">Admin Portal</a></nav></header>
<main><section class="hero"><div class="muted">CONFIGKIT · OFFICIAL UPDATES</div><h1>Announcements</h1><p class="muted">Product news, service notices and community updates from ConfigKit.</p></section><div id="announcements" class="list"><div class="status">Loading announcements…</div></div></main>
<script src="auth-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
<script>
(async()=>{const root=document.getElementById('announcements');try{const c=window.CONFIGKIT_AUTH||{};if(!c.supabaseUrl||!c.supabaseAnonKey)throw new Error('ConfigKit connection is unavailable.');const db=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const {data,error}=await db.from('configkit_announcements').select('title,body,published_at,created_at').eq('status','published').order('published_at',{ascending:false}).limit(50);if(error)throw error;if(!data?.length){root.innerHTML='<div class="empty">There are no announcements yet. Check back soon.</div>';return}root.innerHTML=data.map(a=>'<article class="item"><div class="date">'+new Date(a.published_at||a.created_at).toLocaleString()+'</div><h2>'+String(a.title||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+'</h2><p>'+String(a.body||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])).replace(/\n/g,'<br>')+'</p></article>').join('')}catch(e){root.innerHTML='<div class="status">Could not load announcements: '+String(e.message||e).replace(/[&<>]/g,'')+'</div>'}})();
</script></body></html>
